<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmek</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    

<body>

    <div class="container">

        <h1>Filmek</h1>
        <div class="container mt-3">
            <h2>Új film hozzáadása</h2>
            <form id="filmForm">
                <div class="mb-3 mt-3">
                    <label for="title">Title</label>
                    <input type="text" class="form-control" id="title" placeholder="Enter title" name="title" minlength="3" maxlength="100" required>
                    <span class="msg" id="titleMsg"></span>
                </div>
                <div class="mb-3">
                    <label for="year">Year</label>
                    <input type="number" class="form-control" id="year" placeholder="Enter year" name="year" min="1" max="2026" required>
                    <span class="msg" id="yearMsg"></span>
                </div>
                <div class="mb-3">
                    <label for="genre">Genre</label>
                    <input type="text" class="form-control" id="genre" placeholder="Enter genre" name="genre" minlength="3" maxlength="100" required>
                    <span class="msg" id="genreMsg"></span>
                </div>
                <div class="mb-3">
                    <label for="rating">Rating</label>
                    <input type="number" class="form-control" id="rating" placeholder="Enter rating" name="rating" min="1" max="5" required>
                    <span class="msg" id="ratingMsg"></span>
                </div>
                <button type="button" class="btn btn-primary" onclick="Add()">Submit</button>
            </form>
        </div>


        <br>

        <!-- TÁBLÁZAT -->
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Year</th>
                    <th>Genre</th>
                    <th>Rating</th>
                </tr>
            </thead>

            <tbody id="tartalom">
            </tbody>
        </table>

    </div>

    <script src="main.js"></script>

</body>
</html>
